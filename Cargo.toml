[package]
name = "ltc-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
cpal = "0.18.2"
oximedia-timesync = "0.2"
oximedia-timecode = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
