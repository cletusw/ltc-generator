[package]
name = "ltc-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.28", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
cpal = "0.15"
oximedia-timesync = "0.2"
oximedia-timecode = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
